<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passenger Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

<style>
/* Exact variables mapped from your index.html */
:root {
  --bg: #F2F4F8;
  --card: #FFFFFF;
  --border: #E4E8F0;
  --navy: #0C1F44;
  --navy-2: #16305F;
  --text: #1B2338;
  --muted: #8A93A8;
  --muted-2: #B4BBCB;
  --orange: #FBD9AE;
  --booked: #2745A8;
  --radius-lg: 22px;
  --radius-md: 14px;
  --radius-sm: 9px;
  --ease: cubic-bezier(.22,.9,.32,1);
  --font-display: 'Space Grotesk', sans-serif;
  --font-body: 'Inter', sans-serif;

  --seat-avail-top: #FFFFFF;
  --seat-avail-bot: #86A6B5;
  --seat-select-top: #FDDCAE;
  --seat-select-bot: #E6AE67;

  --error: #D1495B;
  --error-bg: #FDEFEF;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
  font-family: var(--font-body); -webkit-font-smoothing: antialiased;
  padding: 40px clamp(16px, 4vw, 48px) 120px;
}
h1, h2, h3, p { margin: 0; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
::selection { background: var(--navy); color: #fff; }
:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; border-radius: 6px; }

/* Page Header */
.header-wrap { max-width: 800px; margin: 0 auto 40px; text-align: center; }
.page-title { font-family: var(--font-display); font-weight: 500; font-size: 32px; margin-bottom: 8px; }
.page-title b { font-weight: 700; color: var(--navy); }
.page-subtitle { color: var(--muted); font-size: 15px; }

/* Timeline Layout */
.timeline-container {
  max-width: 800px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 40px;
}
.step-section { position: relative; }

/* Timeline numbering */
.step-header {
  display: flex; align-items: center; gap: 16px; margin-bottom: 20px;
}
.step-number {
  width: 40px; height: 40px; border-radius: 12px; background: var(--navy); color: #fff;
  display: flex; align-items: center; justify-content: center; font-family: var(--font-display);
  font-weight: 700; font-size: 18px; box-shadow: 0 8px 16px rgba(12, 31, 68, 0.15);
}
.step-title {
  font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--navy);
}

/* Cards (Matches index.html) */
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 32px; box-shadow: 0 12px 30px -18px rgba(20,30,60,0.14);
  position: relative; overflow: hidden;
}

/* Inputs */
.input-group { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.input-group label {
  font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase;
}
.input-group input {
  padding: 14px 16px; border-radius: var(--radius-md); border: 1px solid var(--border);
  font-family: inherit; font-size: 15px; font-weight: 500; color: var(--text); background: #FAFBFD;
  transition: all 0.2s var(--ease); outline: none; width: 100%;
}
.input-group input:focus {
  border-color: var(--navy); background: #fff; box-shadow: 0 0 0 4px rgba(12, 31, 68, 0.05);
}

/* Passenger List */
.passenger-list { display: flex; flex-direction: column; gap: 20px; }
.passenger-row {
  display: flex; gap: 16px; align-items: flex-end; padding-bottom: 20px;
  border-bottom: 1px dashed var(--border);
  animation: slideIn 0.4s var(--ease) forwards;
}
.passenger-row:last-child { border-bottom: none; padding-bottom: 0; }

@keyframes slideIn {
  from { opacity: 0; transform: translateY(-10px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes fadeOut {
  to { opacity: 0; transform: scale(0.95); height: 0; padding: 0; margin: 0; border: none; }
}
.passenger-row.is-removing { animation: fadeOut 0.3s var(--ease) forwards; overflow: hidden; }

.remove-btn {
  width: 50px; height: 50px; border-radius: var(--radius-md); background: var(--error-bg);
  color: var(--error); display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; flex-shrink: 0;
}
.remove-btn:hover { background: var(--error); color: #fff; transform: translateY(-2px); }
.remove-btn:active { transform: translateY(0); }
.remove-btn:disabled { opacity: 0; pointer-events: none; } /* Hide if only 1 passenger */

/* Add Button */
.add-btn {
  display: inline-flex; align-items: center; gap: 8px; margin-top: 24px;
  padding: 12px 20px; border-radius: var(--radius-md); border: 1px dashed var(--muted-2);
  color: var(--navy); font-weight: 600; font-size: 14px; transition: all 0.2s;
}
.add-btn:hover { border-color: var(--navy); background: #FAFBFD; }
.add-btn .material-symbols-outlined { font-size: 18px; }
  

/* --- Updated Calendar CSS --- */
.calendar-wrapper {
  max-width: 380px; /* Keeps the calendar compact and properly sized on laptops! */
  margin: 0 auto; 
}
.cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.cal-month { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--navy); }
.cal-nav { display: flex; gap: 8px; }
.cal-nav button {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; color: var(--muted); transition: 0.2s;
}
.cal-nav button:hover:not(:disabled) { border-color: var(--navy); color: var(--navy); }
.cal-nav button:disabled { opacity: 0.4; cursor: not-allowed; }

.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; text-align: center; }
.cal-day-name { font-size: 11px; font-weight: 700; color: var(--muted-2); margin-bottom: 8px; }

/* The Seat-Style Date Buttons */
.cal-date {
  width: 100%; aspect-ratio: 1; max-width: 44px; margin: 0 auto;
  border-radius: 8px;
  background: linear-gradient(to bottom, var(--seat-avail-top) 65%, var(--seat-avail-bot) 65%);
  border: 1px solid var(--seat-avail-bot);
  color: var(--navy); font-size: 13px; font-weight: 700; font-family: var(--font-body);
  display: flex; align-items: center; justify-content: center; padding-bottom: 4px;
  transition: transform 180ms var(--ease), box-shadow 180ms var(--ease);
}
.cal-date:not(.empty):not(.disabled):hover { 
  transform: translateY(-4px) scale(1.08);
  box-shadow: 0 12px 25px rgba(0,0,0,.18);
}
.cal-date:not(.empty):not(.disabled):active { transform: scale(0.92); }

.cal-date.disabled { 
  background: #F2F4F8; border-color: #E4E8F0; color: var(--muted-2); 
  pointer-events: none; padding-bottom: 0; box-shadow: none;
}
.cal-date.selected {
  background: linear-gradient(to bottom, var(--seat-select-top) 65%, var(--seat-select-bot) 65%);
  border-color: var(--seat-select-bot); color: var(--navy);
  animation: selectPop 380ms var(--ease);
}
.cal-date.empty { background: transparent; border: none; pointer-events: none; }

@keyframes selectPop {
  0% { transform: scale(0.9); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

/* Floating Continue Button */
.action-bar {
  position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255,255,255,0.8);
  backdrop-filter: blur(12px); border-top: 1px solid var(--border); padding: 20px;
  display: flex; justify-content: center; z-index: 50;
}
.btn-primary {
  background: var(--navy); color: #fff; padding: 16px 40px; border-radius: 99px;
  font-family: var(--font-display); font-size: 16px; font-weight: 700; letter-spacing: 0.05em;
  display: flex; align-items: center; gap: 12px; transition: all 0.3s var(--ease);
  box-shadow: 0 10px 25px rgba(12,31,68,0.3); text-decoration: none;
}
.btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(12,31,68,0.4); background: var(--navy-2); }
.btn-primary:active { transform: translateY(0); }

@media(max-width: 600px) {
  .passenger-row { flex-direction: column; align-items: stretch; gap: 12px; }
  .remove-btn { width: 100%; height: 44px; }
}
</style>
</head>
<body>

<div class="header-wrap">
  <h1 class="page-title">Passenger <b>Details</b></h1>
  <p class="page-subtitle">Who is flying with Air Commander today?</p>
</div>

<div class="timeline-container">
  
  <!-- Step 1 -->
  <div class="step-section">
    <div class="step-header">
      <div class="step-number">1</div>
      <div class="step-title">Travelers</div>
    </div>
    <div class="card">
      <div class="passenger-list" id="passengerList">
        <!-- Passenger rows injected here by JS -->
      </div>
      <button class="add-btn" id="addPassengerBtn">
        <span class="material-symbols-outlined">person_add</span> Add Passenger
      </button>
    </div>
  </div>

  <!-- Step 2 -->
  <div class="step-section">
    <div class="step-header">
      <div class="step-number">2</div>
      <div class="step-title">Departure Date</div>
    </div>
    <div class="card">
      <div class="calendar-wrapper">
        <div class="cal-header">
          <div class="cal-month" id="calMonthDisplay">Month 2026</div>
          <div class="cal-nav">
            <button id="prevMonthBtn"><span class="material-symbols-outlined">chevron_left</span></button>
            <button id="nextMonthBtn"><span class="material-symbols-outlined">chevron_right</span></button>
          </div>
        </div>
        <div class="cal-grid" id="calendarGrid">
          <!-- Calendar days injected by JS -->
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Continue Bar -->
<div class="action-bar">
  <button class="btn-primary" id="continueBtn">
    Continue to Seats <span class="material-symbols-outlined">arrow_forward</span>
  </button>
</div>

<script>
  'use strict';

  // --- Passenger Logic ---
  const passengerList = document.getElementById('passengerList');
  const addBtn = document.getElementById('addPassengerBtn');
  
  function validatePassengers() {
    const inputs = passengerList.querySelectorAll('input');
    // Regex: Only allows uppercase/lowercase letters, spaces, hyphens, and apostrophes
    const nameRegex = /^[A-Za-z\s\-\']+$/; 
    
    for (let input of inputs) {
      const val = input.value.trim();
      
      if (!val) {
        alert("Please fill in all passenger names.");
        input.focus();
        return false;
      }
      
      if (!nameRegex.test(val)) {
        alert("Passenger names can only contain letters. Numbers and special characters are not allowed.");
        input.focus();
        return false;
      }
    }
    return true;
  }

  function createPassengerRow() {
    // Prevent adding a new row if current ones are blank
    if (passengerList.children.length > 0 && !validatePassengers()) {
      alert("Please fill in all passenger names before adding another.");
      return;
    }

    const rowId = `passenger-${Date.now()}`;
    const row = document.createElement('div');
    row.className = 'passenger-row';
    row.id = rowId;
    
    row.innerHTML = `
      <div class="input-group">
        <label>First Name</label>
        <input type="text" placeholder="e.g. John" required>
      </div>
      <div class="input-group">
        <label>Last Name</label>
        <input type="text" placeholder="e.g. Doe" required>
      </div>
      <button class="remove-btn" type="button" aria-label="Remove passenger" onclick="removePassenger('${rowId}')">
        <span class="material-symbols-outlined">delete</span>
      </button>
    `;
    
    passengerList.appendChild(row);
    updateRemoveButtons();
  }

  window.removePassenger = (id) => {
    if (passengerList.children.length <= 1) return; // Always keep 1
    const row = document.getElementById(id);
    row.classList.add('is-removing');
    setTimeout(() => {
      row.remove();
      updateRemoveButtons();
    }, 300);
  }

  function updateRemoveButtons() {
    const rows = passengerList.querySelectorAll('.passenger-row');
    const btns = passengerList.querySelectorAll('.remove-btn');
    btns.forEach(btn => {
      btn.disabled = rows.length === 1; // Disable delete if it's the last remaining person
    });
  }

  addBtn.addEventListener('click', createPassengerRow);
  
  // Initialize with 1 passenger
  createPassengerRow();


  // --- Dynamic Calendar Logic ---
  const calGrid = document.getElementById('calendarGrid');
  const calMonthDisplay = document.getElementById('calMonthDisplay');
  const prevMonthBtn = document.getElementById('prevMonthBtn');
  const nextMonthBtn = document.getElementById('nextMonthBtn');
  
  let selectedDate = null;
  
  // Real-world current date
  const today = new Date();
  const realMonth = today.getMonth();
  const realYear = today.getFullYear();
  const realDate = today.getDate();

  // The month currently being viewed in the UI
  let viewMonth = realMonth;
  let viewYear = realYear;
  
  function buildCalendar() {
    calGrid.innerHTML = `
        <div class="cal-day-name">SUN</div><div class="cal-day-name">MON</div><div class="cal-day-name">TUE</div>
        <div class="cal-day-name">WED</div><div class="cal-day-name">THU</div><div class="cal-day-name">FRI</div><div class="cal-day-name">SAT</div>
    `;

    const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    calMonthDisplay.textContent = `${monthNames[viewMonth]} ${viewYear}`;

    // Disable previous month button if we are looking at the current real-world month
    prevMonthBtn.disabled = (viewYear === realYear && viewMonth === realMonth);

    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

    // Blank slots for days before the 1st
    for(let i=0; i<firstDay; i++) {
      const empty = document.createElement('div');
      empty.className = 'cal-date empty';
      calGrid.appendChild(empty);
    }

    // Actual days
    for(let i=1; i<=daysInMonth; i++) {
      const day = document.createElement('button');
      day.className = 'cal-date';
      day.textContent = i;
      
      const thisDateString = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;

      // Disable dates in the past
      if(viewYear === realYear && viewMonth === realMonth && i < realDate) {
        day.classList.add('disabled'); 
      }

      // Re-apply selected class if they switch months and come back
      if (selectedDate === thisDateString) {
        day.classList.add('selected');
      }

      day.addEventListener('click', () => {
        if(day.classList.contains('disabled')) return;
        
        // Block calendar selection if names are empty
        if (!validatePassengers()) {
            alert("Please complete the passenger details before selecting a date.");
            return;
        }

        document.querySelectorAll('.cal-date').forEach(d => d.classList.remove('selected'));
        day.classList.add('selected');
        selectedDate = thisDateString;
      });

      calGrid.appendChild(day);
    }
  }

  // Month Navigation Listeners
  prevMonthBtn.addEventListener('click', () => {
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    buildCalendar();
  });

  nextMonthBtn.addEventListener('click', () => {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    buildCalendar();
  });

  // Initialize
  buildCalendar();

  // --- Navigation Logic ---
  const continueBtn = document.getElementById('continueBtn');
  continueBtn.addEventListener('click', () => {
    
    if (!validatePassengers()) {
        alert("Please complete all passenger names before continuing.");
        return;
    }
    
    if (!selectedDate) {
        alert("Please select a departure date.");
        return;
    }

    // Extract all names
    const rows = passengerList.querySelectorAll('.passenger-row');
    const passengerNames = [];
    rows.forEach(row => {
        const first = row.querySelectorAll('input')[0].value.trim();
        const last = row.querySelectorAll('input')[1].value.trim();
        passengerNames.push(`${first} ${last}`);
    });
    
    // Save to localStorage so seat.html can read it!
    localStorage.setItem('passengerNames', JSON.stringify(passengerNames));
    localStorage.setItem('selectedPassengerCount', passengerNames.length);
    localStorage.setItem('selectedFlightDate', selectedDate); // Save the date too!
    
    // Navigate to the uploaded HTML file
    window.location.href = 'seat.html'; 
  });

</script>

</body>
</html>
